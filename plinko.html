<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard.com</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: #eee;
    font-family: "Courier New", monospace;
    overflow-x: hidden;
}

header {
    background: #101010;
    border-bottom: 2px solid #333;
    padding: 16px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.logo span {
    color: #777;
}

.money {
    font-size: 20px;
    font-weight: bold;
}

.main {
    width: min(1200px, 96%);
    margin: auto;
    padding: 20px 0 50px;
}

.top {
    margin-bottom: 15px;
}

h1 {
    margin: 0;
    font-size: 34px;
}

.info {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
}

.controls {
    background: #111;
    border: 2px solid #333;
    padding: 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.controls label {
    color: #aaa;
    font-weight: bold;
}

.bet {
    display: flex;
    align-items: center;
    gap: 5px;
}

.bet button {
    width: 38px;
    height: 38px;
    background: #222;
    color: #eee;
    border: 1px solid #444;
    font-family: inherit;
    font-size: 21px;
    cursor: pointer;
}

.bet input {
    width: 125px;
    height: 38px;
    background: #080808;
    color: #fff;
    border: 1px solid #555;
    padding: 5px 10px;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
}

.drop {
    margin-left: auto;
    background: #eee;
    color: #111;
    border: 0;
    height: 44px;
    min-width: 170px;
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.drop:disabled {
    background: #444;
    color: #777;
    cursor: not-allowed;
}

.message {
    min-height: 25px;
    text-align: center;
    font-size: 16px;
    margin: 10px 0;
    font-weight: bold;
}

.boardWrap {
    width: 100%;
    overflow-x: auto;
    background: #050505;
    border: 2px solid #333;
    padding: 15px;
}

#board {
    position: relative;
    width: 1120px;
    height: 900px;
    margin: auto;
    background: #0b0b0b;
    overflow: hidden;
}

.peg {
    position: absolute;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #eee;
    border: 1px solid #aaa;
    transform: translate(-50%, -50%);
}

.ball {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #e53935;
    border: 2px solid #fff;
    transform: translate(-50%, -50%);
    z-index: 20;
}

.arrow {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    z-index: 10;
}

.slot {
    position: absolute;
    bottom: 0;
    height: 115px;
    border-left: 1px solid #333;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 17px;
    transform: translateX(-50%);
}

.slotText {
    font-size: 12px;
    font-weight: bold;
    color: #aaa;
    white-space: nowrap;
    transform: rotate(-90deg);
}

.slot.center .slotText {
    color: #fff;
}

.slot.win {
    background: #eee;
}

.slot.win .slotText {
    color: #111;
}

.bottomInfo {
    margin-top: 12px;
    text-align: center;
    color: #555;
    font-size: 11px;
}
</style>
</head>

<body>

<header>

<div class="logo">
FLASHCARD<span>.COM</span>
</div>

<div class="money" id="money">
$1.00
</div>

</header>

<div class="main">

<div class="top">

<h1>PLINKO</h1>

<div class="info">
50% chance left • 50% chance right
</div>

</div>

<div class="controls">

<label>BET</label>

<div class="bet">

<button onclick="changeBet(-1)">−</button>

<input
id="bet"
type="number"
min="0.01"
step="0.01"
value="1"
>

<button onclick="changeBet(1)">+</button>

</div>

<button
class="drop"
id="dropButton"
onclick="dropBall()"
>
↓ DROP BALL
</button>

</div>

<div
class="message"
id="message"
></div>

<div class="boardWrap">

<div id="board">

<div class="arrow">↓</div>

</div>

</div>

<div class="bottomInfo">
RRR = RETURN TO HOME
</div>

</div>

<script>

const board =
document.getElementById("board");

const moneyDisplay =
document.getElementById("money");

const betInput =
document.getElementById("bet");

const dropButton =
document.getElementById("dropButton");

const message =
document.getElementById("message");

const multipliers = [
1000,
250,
50,
50,
10,
10,
5,
5,
2,
2,
1,
1,
1,
0.5,
1,
1,
1,
2,
2,
5,
5,
10,
10,
50,
50,
250,
1000
];

const ROWS = 27;
const CENTER = 560;
const PEG_SPACING = 38;
const ROW_SPACING = 25;
const TOP_Y = 75;

let savedMoney =
localStorage.getItem("flashcardPlinkoMoney");

let money;

if (
    savedMoney === null ||
    Number(savedMoney) <= 0 ||
    !Number.isFinite(Number(savedMoney))
) {
    money = 1;
    localStorage.setItem(
        "flashcardPlinkoMoney",
        "1.00"
    );
} else {
    money = Number(savedMoney);
}

let dropping = false;

function saveMoney() {

    localStorage.setItem(
        "flashcardPlinkoMoney",
        money.toFixed(2)
    );
}

function updateMoney() {

    moneyDisplay.textContent =
        "$" + money.toFixed(2);

    saveMoney();
}

function createPegs() {

    for (
        let row = 0;
        row < ROWS;
        row++
    ) {

        const count =
            row + 1;

        const y =
            TOP_Y +
            row * ROW_SPACING;

        const totalWidth =
            (count - 1) *
            PEG_SPACING;

        const startX =
            CENTER -
            totalWidth / 2;

        for (
            let i = 0;
            i < count;
            i++
        ) {

            const peg =
                document.createElement("div");

            peg.className = "peg";

            peg.style.left =
                startX +
                i * PEG_SPACING +
                "px";

            peg.style.top =
                y + "px";

            board.appendChild(peg);
        }
    }
}

function createSlots() {

    const slotWidth = 40;

    const startX =
        CENTER -
        ((multipliers.length - 1) *
        slotWidth) / 2;

    for (
        let i = 0;
        i < multipliers.length;
        i++
    ) {

        const slot =
            document.createElement("div");

        slot.className = "slot";

        if (i === 13) {
            slot.classList.add("center");
        }

        slot.style.left =
            startX +
            i * slotWidth +
            "px";

        slot.style.width =
            slotWidth + "px";

        const text =
            document.createElement("div");

        text.className =
            "slotText";

        text.textContent =
            "×" + multipliers[i];

        slot.appendChild(text);

        board.appendChild(slot);
    }
}

function changeBet(amount) {

    let bet =
        Number(betInput.value);

    if (!Number.isFinite(bet)) {
        bet = 1;
    }

    bet += amount;

    if (bet < 0.01) {
        bet = 0.01;
    }

    if (bet > money) {
        bet = money;
    }

    betInput.value =
        bet.toFixed(2);
}

function getBet() {

    const bet =
        Number(betInput.value);

    if (
        !Number.isFinite(bet) ||
        bet <= 0
    ) {
        return 0;
    }

    return Math.round(
        bet * 100
    ) / 100;
}

function createBall() {

    const ball =
        document.createElement("div");

    ball.className = "ball";

    board.appendChild(ball);

    return ball;
}

function moveBall(
    ball,
    fromX,
    fromY,
    toX,
    toY,
    duration
) {

    return new Promise(resolve => {

        const start =
            performance.now();

        function animate(now) {

            const progress =
                Math.min(
                    1,
                    (now - start) /
                    duration
                );

            const eased =
                progress *
                progress *
                (3 - 2 * progress);

            ball.style.left =
                fromX +
                (toX - fromX) *
                eased +
                "px";

            ball.style.top =
                fromY +
                (toY - fromY) *
                eased +
                "px";

            if (progress < 1) {

                requestAnimationFrame(
                    animate
                );

            } else {

                resolve();
            }
        }

        requestAnimationFrame(
            animate
        );
    });
}

async function dropBall() {

    if (dropping) {
        return;
    }

    const bet =
        getBet();

    if (bet <= 0) {

        message.textContent =
            "ENTER A BET.";

        return;
    }

    if (bet > money) {

        message.textContent =
            "NOT ENOUGH MONEY.";

        return;
    }

    dropping = true;
    dropButton.disabled = true;

    money -= bet;

    updateMoney();

    message.textContent =
        "BALL DROPPING...";

    const ball =
        createBall();

    let x = CENTER;
    let y = 35;

    ball.style.left =
        x + "px";

    ball.style.top =
        y + "px";

    let finalPosition = 13;

    for (
        let row = 0;
        row < ROWS;
        row++
    ) {

        const count =
            row + 1;

        const totalWidth =
            (count - 1) *
            PEG_SPACING;

        const startX =
            CENTER -
            totalWidth / 2;

        let nearest =
            Math.round(
                (x - startX) /
                PEG_SPACING
            );

        nearest =
            Math.max(
                0,
                Math.min(
                    count - 1,
                    nearest
                )
            );

        const pegX =
            startX +
            nearest * PEG_SPACING;

        const pegY =
            TOP_Y +
            row * ROW_SPACING;

        await moveBall(
            ball,
            x,
            y,
            pegX,
            pegY - 12,
            65
        );

        x = pegX;
        y = pegY;

        if (Math.random() < 0.5) {
            x -= PEG_SPACING / 2;
        } else {
            x += PEG_SPACING / 2;
        }

        y += ROW_SPACING;

        await moveBall(
            ball,
            pegX,
            pegY - 12,
            x,
            y,
            65
        );

        finalPosition =
            Math.round(
                (x -
                (CENTER - 520)) /
                40
            );

        finalPosition =
            Math.max(
                0,
                Math.min(
                    26,
                    finalPosition
                )
            );
    }

    const startX =
        CENTER -
        (26 * 40) / 2;

    const targetX =
        startX +
        finalPosition * 40;

    await moveBall(
        ball,
        x,
        y,
        targetX,
        825,
        250
    );

    await moveBall(
        ball,
        targetX,
        825,
        targetX,
        865,
        120
    );

    const multiplier =
        multipliers[finalPosition];

    const winnings =
        Math.round(
            bet *
            multiplier *
            100
        ) / 100;

    money += winnings;

    updateMoney();

    message.textContent =
        "×" +
        multiplier +
        " → $" +
        winnings.toFixed(2);

    const slots =
        document.querySelectorAll(
            ".slot"
        );

    if (slots[finalPosition]) {

        slots[finalPosition]
            .classList.add("win");

        setTimeout(function() {

            slots[finalPosition]
                .classList.remove("win");

        }, 1000);
    }

    setTimeout(function() {

        if (ball.parentNode) {
            ball.remove();
        }

    }, 400);

    if (money > 0) {

        betInput.value =
            Math.min(
                bet,
                money
            ).toFixed(2);
    }

    dropping = false;
    dropButton.disabled = false;
}

createPegs();
createSlots();
updateMoney();

let rCount = 0;
let rTimer = null;

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key.toLowerCase() !== "r"
        ) {
            return;
        }

        rCount++;

        clearTimeout(rTimer);

        rTimer =
            setTimeout(
                function() {
                    rCount = 0;
                },
                1000
            );

        if (rCount >= 3) {

            rCount = 0;

            window.location.assign(
                "index.html?games=true"
            );
        }
    }
);

</script>

</body>
</html>
